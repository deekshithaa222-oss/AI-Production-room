name: Load Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  locust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install locust pytest
      - name: Run smoke load
        run: |
          python -m pytest tests/test_chaos.py -q
